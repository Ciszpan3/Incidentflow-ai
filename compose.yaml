services:
  db:
    image: postgres:16
    container_name: incidentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidentflow
      POSTGRES_PASSWORD: incidentflow_dev
      POSTGRES_DB: incidentflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: